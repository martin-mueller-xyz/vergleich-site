<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Preisvergleich: Produkt eingeben, Angebote nach Preis, weiter zum Shop.">
  <title>Vergleich — Produkt suchen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='-apple-system,system-ui,sans-serif' font-size='16' font-weight='600' fill='%23fff'%3EV%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <link rel="alternate" hreflang="de" href="index.html">
  <link rel="alternate" hreflang="en" href="en/index.html">
</head>
<body>
  <header class="mast">
    <div class="mast-brand">
      <div>
        <strong class="wordmark">Vergleich</strong>
        <p class="tagline">Suchen. Preise sehen. Zum Shop.</p>
      </div>
    </div>
    <div class="mast-end">
      <nav class="lang-switch" aria-label="Sprache">
        <a href="index.html" lang="de" hreflang="de" aria-current="true">DE</a>
        <a href="en/index.html" lang="en" hreflang="en">EN</a>
      </nav>
    </div>
  </header>
  <main class="wrap search-page">
    <section class="hero">
      <h1>Was suchst du?</h1>
      <p class="lead">Gib ein Produkt ein. Wir zeigen sourced Angebote, günstigster Preis zuerst. Klick öffnet den Shop.</p>
      <form id="search-form" class="search-box" role="search" action="index.html" method="get">
        <label class="sr-only" for="q">Produkt</label>
        <input id="q" name="q" type="search" placeholder="z. B. KI-Telefon, Opus Clip, ChatGPT" autocomplete="off">
        <button type="submit">Vergleichen</button>
      </form>
    </section>
    <p id="status" class="status" role="status"></p>
    <div id="results"></div>
  </main>
  <footer class="colophon">
    <p><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></p>
  </footer>
  <script src="app.js" defer></script>
</body>
</html>
